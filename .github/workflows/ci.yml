name: CI

on:
  push:
    branches: [main, phase-1-foundation, phase-2-financial-mvp]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run setup
      - run: npm run test:phase2
      - run: npm run build
